apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-color-k8-beta
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/andresramilo/app-of-apps.git
    path: apps
    targetRevision: HEAD
  destination:
    namespace: argocd
    server: https://k3d-alpha-server-0:6443
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
