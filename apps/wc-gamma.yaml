apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-color-k8-gamma
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/andresramilo/web-color-deploy
    path: k8s/app-of-apps
    targetRevision: HEAD
  destination:
    namespace: web-color
    server: https://k3d-gamma-server-0:6443
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
